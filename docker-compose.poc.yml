# POC environment — server GPU (rekomendasi L40S 48GB atau setara)
# Jalankan dengan: docker compose -f docker-compose.poc.yml up -d
#
# Sebelum jalankan:
#   1. cp .env.poc .env
#   2. Edit .env: ganti semua CHANGE_ME (JWT_SECRET, POSTGRES_PASSWORD, MINIO_*, dll)
#   3. (opsional) Set HF_TOKEN di .env jika butuh akses gated model
#   4. docker compose -f docker-compose.poc.yml build backend
#   5. docker compose -f docker-compose.poc.yml up -d

services:
  # ── Database & Storage ──────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ragchat
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat -d ragchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    command: redis-stack-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # Console UI untuk buat bucket
    restart: unless-stopped

  # ── LLM Serving (GPU) ──────────────────────────────────────────────────

  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen3-VL-8B-Instruct
      --port 8001
      --max-model-len 8192
      --gpu-memory-utilization 0.85
      --max-num-seqs 64
      --enable-prefix-caching
      --served-model-name qwen3-vl-8b
    # NOTE: --limit-mm-per-prompt image=2 dihapus karena syntax flag-nya berbeda
    # antar versi vLLM dan bisa cause parsing error. Backend sudah enforce
    # MAX_IMAGES_PER_MESSAGE=2 di Python level (config.py).
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Embedding & Reranker (CPU, hemat VRAM) ─────────────────────────────

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id Qwen/Qwen3-Embedding-0.6B --port 8002
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/data
    restart: unless-stopped

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id BAAI/bge-reranker-v2-m3 --port 8003
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/data
    restart: unless-stopped

  # ── Moderation (Llama Guard 3 via Ollama, instance terpisah dari LLM) ──

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Backend Application ────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      vllm:
        condition: service_started
      tei-embed:
        condition: service_started
      tei-rerank:
        condition: service_started
      ollama:
        condition: service_started
    volumes:
      - ./models:/app/models:ro
      - ./data/narratives:/app/data/narratives:ro
      - ./data/json:/app/data/json:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1

  # ── Monitoring Stack ───────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  minio_data:
  hf_cache:
  ollama_data:
  prometheus_data:
  grafana_data:
