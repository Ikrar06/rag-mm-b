<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot UNHAS</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Login overlay -->
    <div id="loginOverlay" class="login-overlay hidden">
        <div class="login-card">
            <div class="login-logo">
                <h2>RAG Chatbot UNHAS</h2>
                <p>Asisten Akademik Universitas Hasanuddin</p>
            </div>
            <form id="loginForm">
                <div class="login-field">
                    <label for="usernameInput">Username</label>
                    <input type="text" id="usernameInput" placeholder="Masukkan username" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="passwordInput">Password</label>
                    <input type="password" id="passwordInput" placeholder="Masukkan password" autocomplete="current-password" required>
                </div>
                <div id="loginError" class="login-error hidden">Username atau password salah.</div>
                <button type="submit" id="loginBtn" class="login-btn">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Main app -->
    <div class="app" id="mainApp">
        <header class="header">
            <div class="header-top">
                <div>
                    <h1>RAG Chatbot UNHAS</h1>
                    <p>Asisten Akademik Universitas Hasanuddin</p>
                </div>
                <div class="header-user" id="headerUser">
                    <span id="userLabel"></span>
                    <div class="header-actions">
                        <button id="newSessionBtn" class="new-session-btn" onclick="handleNewSession()">+ Chat Baru</button>
                        <button id="logoutBtn" class="logout-btn" onclick="handleLogout()">Keluar</button>
                    </div>
                </div>
            </div>
            <div id="status" class="status">Mengecek koneksi...</div>
        </header>

        <main class="chat-container" id="chatContainer">
            <div class="message bot-message">
                <div class="message-content">
                    Halo! Saya asisten akademik UNHAS. Silakan ajukan pertanyaan tentang informasi akademik.
                </div>
            </div>
        </main>

        <footer class="input-container">
            <div id="imagePreviewBar" class="image-preview-bar" hidden></div>
            <form id="chatForm" class="input-form">
                <input
                    type="file"
                    id="imageInput"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                    hidden
                >
                <button
                    type="button"
                    id="attachBtn"
                    class="attach-btn"
                    title="Lampirkan gambar (max 2)"
                    aria-label="Lampirkan gambar"
                >
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </button>
                <input
                    type="text"
                    id="queryInput"
                    placeholder="Ketik pertanyaan Anda..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="sendBtn">Kirim</button>
            </form>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
