# Dev environment — RTX 3060, semua service lokal
# Jalankan: docker compose -f docker-compose.dev.yml up -d
# Ollama tetap jalan di host Windows (akses GPU langsung)

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z   # pakai folder yang sudah ada — data index terjaga
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ragchat
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # redis-stack (pakai kalau butuh RedisSearch vector index untuk semantic cache Tier 2)
  # Ganti redis di atas dengan ini:
  # redis:
  #   image: redis/redis-stack:latest
  #   command: redis-stack-server --maxmemory 1gb --maxmemory-policy allkeys-lru
  #   volumes:
  #     - redis_data:/data
  #   ports:
  #     - "6379:6379"
  #     - "8001:8001"   # Redis Insight UI

  # MinIO — uncomment kalau butuh image storage (vision feature)
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ragchat
  #     MINIO_ROOT_PASSWORD: dev-secret
  #   volumes:
  #     - minio_data:/data
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"

volumes:
  pg_data:
  redis_data:
  # minio_data:
